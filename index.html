<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Teste de autenticação — Comissão de Pele</title><style>body{font-family:system-ui,Arial;background:#f1f5f9;color:#17324b;margin:0;padding:25px}main{max-width:490px;margin:50px auto;background:white;border-radius:14px;padding:26px;box-shadow:0 3px 18px #123e621a}h1{font-size:1.35rem}label{display:block;margin:16px 0 6px;font-weight:650}input,button{box-sizing:border-box;width:100%;padding:13px;font:inherit;border-radius:8px}input{border:1px solid #b4c4d2}button{background:#176b9b;color:white;border:0;margin-top:16px;cursor:pointer}button:disabled{opacity:.55}#result{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#53677b}</style></head><body><main><h1>Comissão de Pele — Teste de login</h1><p>Esta página verifica somente a autenticação. Não acessa dados clínicos.</p><p><strong>Conta:</strong> admin.teste@comissaopele.example</p><form id="form"><label for="password">Senha cadastrada no Firebase</label><input id="password" type="password" required autocomplete="current-password"><button id="btn">Testar autenticação</button></form><p id="result" role="status"></p><small>Não compartilhe sua senha. Não utilize dados reais de pacientes nesta etapa.</small></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';import{getAuth,signInWithEmailAndPassword,signOut}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';const config={apiKey:'AIzaSyCCGumKTiFrvU3pbLyvq-6g2PrEttnx7h8',authDomain:'comiss-pele.firebaseapp.com',projectId:'comiss-pele',appId:'1:684909755969:web:5099699931bdfb648810c0'};const auth=getAuth(initializeApp(config));const form=document.getElementById('form'),result=document.getElementById('result'),btn=document.getElementById('btn');form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;result.textContent='Verificando...';try{const credential=await signInWithEmailAndPassword(auth,'admin.teste@comissaopele.example',document.getElementById('password').value);result.textContent=credential.user.uid==='GVvVUhbzCqMdidSKj3vT6aTkHYt1'?'SUCESSO: autenticação confirmada e UID correto.':'Autenticação aceita, mas UID diferente do esperado. Não prossiga.';await signOut(auth)}catch(err){result.textContent='Falha: '+(err.code||'erro-desconhecido')+'\n'+(err.message||'')}finally{btn.disabled=false;document.getElementById('password').value=''}});</script></body></html>
